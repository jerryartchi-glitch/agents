<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GPS Агенты</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #f5f6f8;
        color: #222;
    }

    .container {
        max-width: 600px;
        margin: 0 auto;
    }

    h1 {
        text-align: center;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 25px;
    }

    .agents {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .agent-button {
        border: none;
        border-radius: 12px;
        padding: 18px 10px;
        background: white;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    .agent-button:active {
        transform: scale(0.97);
    }

    .agent-button.loading {
        background: #fff3cd;
    }

    .agent-button.success {
        background: #d4edda;
    }

    .agent-button.error {
        background: #f8d7da;
    }

    .status {
        margin-top: 25px;
        padding: 18px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        display: none;
    }

    .status.show {
        display: block;
    }

    .status-title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .coordinates {
        line-height: 1.7;
        font-size: 14px;
    }

    .map-link {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 15px;
        background: #4285f4;
        color: white;
        text-decoration: none;
        border-radius: 8px;
    }

    @media (max-width: 400px) {
        .agents {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>📍 Агенты</h1>

    <div class="subtitle">
        Нажмите свою торговую точку
    </div>

    <div class="agents">

        <button class="agent-button" onclick="sendGPS('Агент 1', this)">
            📍 Агент 1
        </button>

        <button class="agent-button" onclick="sendGPS('Агент 2', this)">
            📍 Агент 2
        </button>

        <button class="agent-button" onclick="sendGPS('Агент 3', this)">
            📍 Агент 3
        </button>

        <button class="agent-button" onclick="sendGPS('Агент 4', this)">
            📍 Агент 4
        </button>

        <button class="agent-button" onclick="sendGPS('Агент 5', this)">
            📍 Агент 5
        </button>

        <button class="agent-button" onclick="sendGPS('Агент 6', this)">
            📍 Агент 6
        </button>

        <button class="agent-button" onclick="sendGPS('Агент 7', this)">
            📍 Агент 7
        </button>

        <button class="agent-button" onclick="sendGPS('Агент 8', this)">
            📍 Агент 8
        </button>

        <button class="agent-button" onclick="sendGPS('Агент 9', this)">
            📍 Агент 9
        </button>

        <button class="agent-button" onclick="sendGPS('Агент 10', this)">
            📍 Агент 10
        </button>

        <button class="agent-button" onclick="sendGPS('Агент 11', this)">
            📍 Агент 11
        </button>

        <button class="agent-button" onclick="sendGPS('Агент 12', this)">
            📍 Агент 12
        </button>

        <button class="agent-button" onclick="sendGPS('Агент 13', this)">
            📍 Агент 13
        </button>

        <button class="agent-button" onclick="sendGPS('Агент 14', this)">
            📍 Агент 14
        </button>

        <button class="agent-button" onclick="sendGPS('Агент 15', this)">
            📍 Агент 15
        </button>

        <button class="agent-button" onclick="sendGPS('Агент 16', this)">
            📍 Агент 16
        </button>

        <button class="agent-button" onclick="sendGPS('Агент 17', this)">
            📍 Агент 17
        </button>

        <button class="agent-button" onclick="sendGPS('Агент 18', this)">
            📍 Агент 18
        </button>

    </div>


    <div id="status" class="status">

        <div id="statusTitle" class="status-title"></div>

        <div id="coordinates" class="coordinates"></div>

        <a id="mapLink"
           class="map-link"
           href="#"
           target="_blank">
            🗺️ Открыть Google Maps
        </a>

    </div>

</div>


<script>

/* =====================================================
   ВСТАВЬ СЮДА URL ТВОЕГО GOOGLE APPS SCRIPT
   ===================================================== */

const GOOGLE_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbxvHm2xR7c9LfYNbB98Fli2R1C_FlpBBliW8SjSXCG-adx5rXrIgdF8bbvetvtRYAB-/exec";


/* =====================================================
   ОТПРАВКА GPS
   ===================================================== */

function sendGPS(agent, button) {

    // Меняем состояние кнопки
    button.classList.remove("success", "error");
    button.classList.add("loading");

    button.innerHTML = "⏳ Определяем...";


    // Проверяем поддержку GPS
    if (!navigator.geolocation) {

        showError(
            "Ваш браузер не поддерживает определение местоположения"
        );

        resetButton(button, agent);

        return;
    }


    // Получаем координаты
    navigator.geolocation.getCurrentPosition(

        function(position) {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;

            const accuracy =
                position.coords.accuracy;


            // Время телефона
            const time =
                new Date().toLocaleString("ru-RU");


            // Данные для Google Apps Script
            const data = {
                agent: agent,
                latitude: latitude,
                longitude: longitude,
                accuracy: accuracy,
                time: time
            };


            /*
             * Отправляем данные в режиме no-cors,
             * чтобы обойти блокировку CORS браузера
             */

            fetch(
                GOOGLE_SCRIPT_URL,
                {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify(data)
                }
            )
            .then(function() {

                button.classList.remove("loading");
                button.classList.add("success");

                button.innerHTML =
                    "✅ " + agent;


                // Показываем результат
                showSuccess(
                    agent,
                    latitude,
                    longitude,
                    accuracy,
                    time
                );

            })
            .catch(function(error) {

                console.error(error);

                button.classList.remove("loading");
                button.classList.add("error");

                button.innerHTML =
                    "❌ " + agent;


                showError(
                    "Не удалось отправить координаты"
                );

            });

        },


        function(error) {

            button.classList.remove("loading");
            button.classList.add("error");

            button.innerHTML =
                "❌ " + agent;


            let message =
                "Не удалось определить местоположение";


            if (error.code === 1) {

                message =
                    "Вы запретили доступ к местоположению. Разрешите GPS для этого сайта.";

            }

            else if (error.code === 2) {

                message =
                    "Телефон не смог определить местоположение.";

            }

            else if (error.code === 3) {

                message =
                    "GPS отвечает слишком долго. Попробуйте ещё раз.";

            }


            showError(message);

        },


        {
            enableHighAccuracy: true,

            timeout: 20000,

            maximumAge: 0
        }

    );

}


/* =====================================================
   УСПЕШНАЯ ОТПРАВКА
   ===================================================== */

function showSuccess(
    agent,
    latitude,
    longitude,
    accuracy,
    time
) {

    const status =
        document.getElementById("status");

    const statusTitle =
        document.getElementById("statusTitle");

    const coordinates =
        document.getElementById("coordinates");

    const mapLink =
        document.getElementById("mapLink");


    status.classList.add("show");


    statusTitle.innerHTML =
        "✅ " + agent +
        " — местоположение отправлено";


    coordinates.innerHTML =

        "📍 Широта: <b>" +
        latitude.toFixed(6) +
        "</b><br>" +

        "📍 Долгота: <b>" +
        longitude.toFixed(6) +
        "</b><br>" +

        "🎯 Точность: <b>" +
        Math.round(accuracy) +
        " м</b><br>" +

        "🕐 Время: <b>" +
        time +
        "</b>";


    /*
     * Ссылка на Google Maps
     */

    mapLink.href =
        "https://www.google.com/maps?q=" +
        latitude +
        "," +
        longitude;

}


/* =====================================================
   ОШИБКА
   ===================================================== */

function showError(message) {

    const status =
        document.getElementById("status");

    const statusTitle =
        document.getElementById("statusTitle");

    const coordinates =
        document.getElementById("coordinates");

    const mapLink =
        document.getElementById("mapLink");


    status.classList.add("show");


    statusTitle.innerHTML =
        "❌ Ошибка";


    coordinates.innerHTML =
        message;


    mapLink.style.display =
        "none";
}


/* =====================================================
   ВОЗВРАТ КНОПКИ
   ===================================================== */

function resetButton(button, agent) {

    button.classList.remove(
        "loading",
        "success",
        "error"
    );

    button.innerHTML =
        "📍 " + agent;
}

</script>

</body>
</html>
